name: Cardmunch
description: CardMunch was a mobile business-card scanning service that used human transcription
  to turn photographed business cards into contact records on iOS. Founded as a Y Combinator
  and 500 Global backed startup, it was acquired by LinkedIn in January 2011 for a reported
  sum under $3 million and operated as a free LinkedIn-branded iPhone app. LinkedIn discontinued
  the app on July 11, 2014, migrating its users to Evernote's business-card scanning feature.
  CardMunch never published a public developer program, API, or SDK, and the cardmunch.com
  domain was re-registered by an unrelated party in April 2016 and now hosts an affiliate
  content blog. This profile is retained as a historical record; there is no API surface to
  enrich.
